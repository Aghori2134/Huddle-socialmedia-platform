		<div class="auth-container">
			<div class="auth-box">
				<input type="radio" id="tab-login" name="auth-tabs" checked>
				<input type="radio" id="tab-signup" name="auth-tabs">

				<div class="auth-tabs">
					<label for="tab-login" class="tab-btn" id="login-label">Login</label>
					<label for="tab-signup" class="tab-btn" id="signup-label">Sign Up</label>
				</div>

				<form id="loginForm" class="auth-form">
					<h2 style="color:white">Welcome Back!</h2>
					<p class="subtitle">Log in to manage your tours and travels</p>
					
					<div class="input-group">
						<i class="ri-mail-fill"></i>
						<input type="email" placeholder="Email Address" required>
					</div>

					<div class="input-group">
						<i class="ri-lock-password-fill"></i>
						<input type="password" placeholder="Password" required>
					</div>

					<button type="submit" class="submit-btn">Login</button>
				</form>

				<form id="signupForm" class="auth-form">
					<h2 style="color:white">Create Account</h2>
					<p class="subtitle">Fill your Details</p>

					<div class="input-group">
						<i class="ri-user-fill"></i>
						<input type="text" placeholder="Full Name" required>
					</div>
					
					<div class="input-group">
						<i class="ri-mail-fill"></i>
						<input type="email" placeholder="Email Address" required>
					</div>

					<div class="input-group">
						<i class="ri-lock-password-fill"></i>
						<input type="password" placeholder="Password" required>
					</div>

					<button type="submit" class="submit-btn">Sign Up</button>
				</form>
			</div>
		</div>

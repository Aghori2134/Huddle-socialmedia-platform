				<div class="containts3">

				</div>
				<div class="containts4">

				</div>
			</section>
			<a href="index.html"><div class="logo"></div></a>
			<div class="book">
				<a href="login-sign.html" style="text-decoration:none; color:white;"><b>Login/Signup</b></a>
			</div>
		</nav>
		<div class="glass-chat-wrapper">
			<div class="conversations-panel">
				<div class="panel-header">
					<h3>Chats</h3>
					<button class="icon-btn"><i class="ri-add-line"></i></button>
				</div>
				
				<div class="search-bar">
					<i class="ri-search-2-line"></i>
					<input type="text" placeholder="Search direct messages...">
				</div>

				<div class="active-users-bar">
					<div class="active-avatar online">
						<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRx2MPl0cP4JCKyDUZalUI22n5kjPSKM6BUfWmpLaIeeA&s=10" alt="avatar">
					</div>
					<div class="active-avatar online">
						<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR47x2gA8dweKp2Be7C2Up6tOcLa1yQLKDoVbe73Vr0wA&s" alt="avatar">
					</div>
					<div class="active-avatar">
						<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHyoFOpMUkkm0Cl-pGYIW8U0mahjdtBgnjjS0RvyFobA&s=10" alt="avatar">
					</div>
				</div>

				<div class="conversations-list">
					<div class="conversation-item active">
						<div class="avatar-box online">
							<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR47x2gA8dweKp2Be7C2Up6tOcLa1yQLKDoVbe73Vr0wA&s" alt="triggeredinsaan">
						</div>
						<div class="conversation-details">
							<div class="title-row">
								<span class="username">triggeredinsaan</span>
								<span class="timestamp">12m</span>
							</div>
							<p class="preview-text">Are we still meeting up tomorrow?</p>
						</div>
						<span class="unread-badge">2</span>
					</div>

					<div class="conversation-item">
						<div class="avatar-box online">
							<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHyoFOpMUkkm0Cl-pGYIW8U0mahjdtBgnjjS0RvyFobA&s=10" alt="carryminati">
						</div>
						<div class="conversation-details">
							<div class="title-row">
								<span class="username">carryminati</span>
								<span class="timestamp">2h</span>
							</div>
							<p class="preview-text">Check out the new video upload!</p>
						</div>
					</div>

					<div class="conversation-item">
						<div class="avatar-box">
							<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcReNPdlVcrqzeabK7yDdg2dkxqA8uRlsgXiJQgiFe_BJg&s=10" alt="Mythpat">
						</div>
						<div class="conversation-details">
							<div class="title-row">
								<span class="username">Mythpat</span>
								<span class="timestamp">1d</span>
							</div>
							<p class="preview-text">Catch you later bro.</p>
						</div>
					</div>
				</div>
			</div>
			<div class="active-chat-panel">
				<div class="chat-topbar">
					<div class="user-meta">
						<div class="avatar-box online">
							<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR47x2gA8dweKp2Be7C2Up6tOcLa1yQLKDoVbe73Vr0wA&s" alt="avatar">
						</div>
						<div>
							<h4>triggeredinsaan</h4>
							<span class="subtext">Active Now</span>
						</div>
					</div>
					<div class="topbar-actions">
						<button class="icon-btn"><i class="ri-phone-fill"></i></button>
						<button class="icon-btn"><i class="ri-vidicon-fill"></i></button>
						<button class="icon-btn"><i class="ri-information-fill"></i></button>
					</div>
				</div>

				<div class="messages-scroll-area">
					<div class="chat-divider"><span>Today</span></div>
				</div>

				<div class="chat-input-bar">
					<button class="icon-btn"><i class="ri-emotion-happy-line"></i></button>
					<button class="icon-btn"><i class="ri-image-add-line"></i></button>
					<input type="text" placeholder="Write a message...">
					<button class="send-btn"><i class="ri-send-plane-2-fill"></i></button>
				</div>
			</div>
		</div>

		</nav>
